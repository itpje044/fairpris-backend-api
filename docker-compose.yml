version: '3.9'

services:
  fairpris-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fairpris-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - BASE_URL=${BASE_URL}
      - PENNEO_CLIENT_ID=${PENNEO_CLIENT_ID}
      - PENNEO_CLIENT_SECRET=${PENNEO_CLIENT_SECRET}
      - PENNEO_API_KEY=${PENNEO_API_KEY}
      - PENNEO_API_SECRET=${PENNEO_API_SECRET}
      - PENNEO_REDIRECT_URI=${PENNEO_REDIRECT_URI}
      - PENNEO_OAUTH_BASE_URL=${PENNEO_OAUTH_BASE_URL}
      - PENNEO_API_BASE_URL=${PENNEO_API_BASE_URL}
      - CUBE_API_URL=${CUBE_API_URL}
      - CUBE_API_KEY=${CUBE_API_KEY}
    volumes:
      - pdf-storage:/app/public/pdfs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pdf-storage:
    driver: local
